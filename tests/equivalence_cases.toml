# Declarative Sphinx build-equivalence cases.
# Each case builds `actual`, builds its hand-expanded `expected` form,
# and compares the selected HTML output byte-for-byte.
schema_version = 1

[[cases]]
id = "custom_myst_sub_delimiters_code_block"
description = "Custom MyST substitution delimiters are respected."
output = "markdown_document.html"

[cases.actual]
exception_on_warning = true

[cases.actual.confoverrides]
"extensions" = ["myst_parser", "sphinx_substitution_extensions"]
"myst_enable_extensions" = ["substitution"]
"myst_substitutions" = { "a" = "example_substitution" }
"myst_sub_delimiters" = ["[", "]"]

[cases.actual.files]
"conf.py" = ""
"index.rst" = '''
.. toctree::

   markdown_document
'''
"markdown_document.md" = '''
# Title

```{code-block}
:substitutions:

$ PRE-[[a]]-POST
```
'''

[cases.expected]
exception_on_warning = true

[cases.expected.confoverrides]
"extensions" = ["myst_parser"]

[cases.expected.files]
"conf.py" = ""
"index.rst" = '''
.. toctree::

   markdown_document
'''
"markdown_document.md" = '''
# Title

```{code-block}

$ PRE-example_substitution-POST
```
'''

