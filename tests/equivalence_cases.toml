[[cases]]
id = "default_substitution_include_content"
description = "Replace include content when substitutions are enabled by\ndefault."
output = "index.html"

[cases.actual]
exception_on_warning = true

[cases.actual.confoverrides]
"extensions" = ["sphinx_substitution_extensions"]
"substitutions_default_enabled" = true

[cases.actual.files]
"conf.py" = ""
"example.txt" = '''
Included literal content::

   Content with |name| placeholder
'''
"index.rst" = '''
.. |name| replace:: example

.. include:: example.txt
'''

[cases.expected]
exception_on_warning = true

[cases.expected.confoverrides]

[cases.expected.files]
"conf.py" = ""
"example.txt" = '''
Included literal content::

   Content with example placeholder
'''
"index.rst" = '''
.. include:: example.txt
'''

