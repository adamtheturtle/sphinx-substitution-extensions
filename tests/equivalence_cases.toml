[[cases]]
id = "default_substitutions_image_disabled_path"
description = "When ``substitutions_default_enabled`` is True but ``image`` has the\n``:nopath-substitutions:`` flag, path substitutions should not be\napplied.\n\nNote: This test uses MyST format with custom delimiters because the `|`\ncharacter cannot be used in Windows file paths."
output = "markdown_document.html"

[cases.actual]
exception_on_warning = true

[cases.actual.confoverrides]
"extensions" = ["myst_parser", "sphinx_substitution_extensions"]
"myst_enable_extensions" = ["substitution"]
"myst_substitutions" = { "a" = "example_substitution" }
"myst_sub_delimiters" = ["[", "]"]
"substitutions_default_enabled" = true

[cases.actual.files]
"conf.py" = ""
"index.rst" = '''
.. toctree::

   markdown_document
'''
"markdown_document.md" = '''
# Title

```{image} [[a]].png
:nopath-substitutions:
```
'''

[cases.actual.binary_files]
"[[a]].png" = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAACklEQVR4nGMAAQAABQABDQottAAAAABJRU5ErkJggg=="

[cases.expected]
exception_on_warning = true

[cases.expected.confoverrides]
"extensions" = ["myst_parser"]

[cases.expected.files]
"conf.py" = ""
"index.rst" = '''
.. toctree::

   markdown_document
'''
"markdown_document.md" = '''
# Title

```{image} [[a]].png
```
'''

[cases.expected.binary_files]
"[[a]].png" = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAACklEQVR4nGMAAQAABQABDQottAAAAABJRU5ErkJggg=="

