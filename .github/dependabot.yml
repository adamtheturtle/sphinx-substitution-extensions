---
version: 2

updates:
  - package-ecosystem: pip
    allow:
      - dependency-type: all
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  # Dependabot cannot read prek.toml yet:
  # https://github.com/dependabot/dependabot-core/issues/14624
